# ==========================================================================
# clinic-proxy.conf  —  reverse-proxy body for dedicated clinic domains
# Mounted at /etc/nginx/snippets/clinic-proxy.conf and `include`d inside the
# clinic catch-all server{} block (and reusable by generated per-clinic blocks
# that target the SHARED backend, i.e. host-based multi-tenancy).
#
# Multi-tenancy model (default): a single backend renders every clinic's
# micro-site based on the incoming Host header. We therefore preserve Host and
# forward an explicit X-Clinic-Domain so the app can resolve tenant -> clinic.
#
# Requirement #4 (un-removable SEO backlink):
#   sub_filter rewrites the HTML RESPONSE BODY on the way out, injecting the
#   mandatory footer link back to the platform. Because this happens in nginx,
#   the clinic cannot delete it by editing their own HTML/app — it is enforced
#   at the edge for every text/html response. $clinic_backlink_html is chosen
#   per-domain by a map{} in nginx.conf (default: /shiraz/beauty).
# ==========================================================================

location / {
    proxy_pass         http://backend_app;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Clinic-Domain   $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   Connection        "";

    # sub_filter cannot rewrite a gzip/brotli-compressed upstream body, so ask
    # the backend for plain HTML; nginx re-compresses to the client via gzip.
    proxy_set_header   Accept-Encoding   "";

    # --- Mandatory, edge-injected platform backlink (PageRank distribution) ---
    sub_filter_once    on;                 # inject a single time per document
    sub_filter_types   text/html;          # (default, stated for clarity)
    sub_filter '</body>'
        '<footer class="salam-doctor-attribution" style="text-align:center;padding:16px;font:14px/1.7 Tahoma,sans-serif;background:#0f172a;color:#94a3b8">$clinic_backlink_html</footer></body>';
}
