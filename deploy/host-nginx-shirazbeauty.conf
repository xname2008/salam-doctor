# Host nginx site config for shirazbeauty.ir
# Proxies to the isolated shirazbeauty Docker stack on 127.0.0.1:8080
#
# Install:
#   sudo cp deploy/host-nginx-shirazbeauty.conf /etc/nginx/sites-available/shirazbeauty.ir
#   sudo ln -sf /etc/nginx/sites-available/shirazbeauty.ir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream shirazbeauty_backend {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name shirazbeauty.ir www.shirazbeauty.ir;

    # Leave in place for a later certbot --webroot run (no SSL listener yet).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://shirazbeauty_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }
}
