# shirazbeauty.ir — Next.js frontend + FastAPI backend from the shirazbeauty-app
# stack, reached over the shared salam-doctor network.
#
#   /       -> shirazbeauty-app-web:3000   (Next.js, production standalone build)
#   /api/   -> shirazbeauty-app-api:8000   (FastAPI)
#
# The previous placeholder stack (shirazbeauty-web:80, port 8080) is still
# running; the rollback is in shirazbeauty.ir.conf.bak-*.

upstream shirazbeauty_next {
    server shirazbeauty-app-web:3000;
    keepalive 16;
}

upstream shirazbeauty_api {
    server shirazbeauty-app-api:8000;
    keepalive 8;
}

server {
    listen      80;
    server_name shirazbeauty.ir www.shirazbeauty.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://shirazbeauty.ir$request_uri;
    }
}

server {
    listen      443 ssl;
    http2       on;
    server_name www.shirazbeauty.ir;

    ssl_certificate     /etc/letsencrypt/live/shirazbeauty.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shirazbeauty.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://shirazbeauty.ir$request_uri;
}

server {
    listen      443 ssl;
    http2       on;
    server_name shirazbeauty.ir;

    ssl_certificate     /etc/letsencrypt/live/shirazbeauty.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shirazbeauty.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass         http://shirazbeauty_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
    }

    location / {
        proxy_pass         http://shirazbeauty_next;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";
    }
}
