# SEO & landing-page performance — included inside salam-doctor.com server blocks
# (after site-locations.conf). Mounted via docker-compose web service.

# ── Static asset cache (CSS, JS, fonts, images at any path) ─────────────────
location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|svg|ico|webp|avif|jpg|jpeg|png|gif)$ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
}

# ── Sitemap: prefer static file (Python/cron), fallback to Node API ──────────
location = /sitemap.xml {
    root /usr/share/nginx/html;
    default_type application/xml;
    charset utf-8;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files /sitemap.xml @sitemap_dynamic;
}

location @sitemap_dynamic {
    proxy_pass         http://backend_app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    add_header X-Sitemap-Source "dynamic" always;
}

# ── Profile / doctor / services: proxy to Node (never static try_files) ─────
# Use ^~ so these win over regex asset locations and the location / try_files.
location = /profile.html {
    proxy_pass         http://backend_app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
}

location ^~ /doctor/ {
    proxy_pass         http://backend_app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
}

location ^~ /services/ {
    proxy_pass         http://backend_app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
}
