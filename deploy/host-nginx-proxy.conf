location = /sitemap-articles.xml {
    root /usr/share/nginx/html;
    default_type application/xml;
    charset utf-8;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files /sitemap-articles.xml @sitemap_articles_backend;
}

location @sitemap_articles_backend {
    proxy_pass         http://salam_backend;
