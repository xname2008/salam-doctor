# Host nginx site config for salam-doctor.ir
# Install: sudo cp deploy/host-nginx-salam-doctor.conf /etc/nginx/sites-available/salam-doctor.ir
#          sudo ln -sf /etc/nginx/sites-available/salam-doctor.ir /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   - Docker backend on 127.0.0.1:3000 (docker-compose.backend-only.yml)
#   - Site files in /home/xname2008/Documents/nginx/html
#   - SSL certs at /etc/letsencrypt/live/salam-doctor.ir/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream salam_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name salam-doctor.ir www.salam-doctor.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://salam-doctor.ir$request_uri;
    }
}

# www → non-www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.salam-doctor.ir;

    ssl_certificate     /etc/letsencrypt/live/salam-doctor.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salam-doctor.ir/privkey.pem;

    return 301 https://salam-doctor.ir$request_uri;
}

# Main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name salam-doctor.ir;

    root /home/xname2008/Documents/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/salam-doctor.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/salam-doctor.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- Dynamic routes → Node backend ---
    include /home/xname2008/Documents/nginx/html/deploy/host-nginx-proxy.conf;

    # --- Static HTML (default) ---
    location / {
        try_files $uri $uri/ =404;
    }
}
