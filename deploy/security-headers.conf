# ==========================================================================
# security-headers.conf  —  strict security headers (shared snippet)
# Mounted at /etc/nginx/snippets/security-headers.conf and `include`d inside
# every server{} block (platform + clinic sites).
#
# NOTE on nginx add_header inheritance:
#   add_header is NOT merged into a nested location that defines its own
#   add_header. Locations here that set their own headers (cache/asset blocks)
#   should `include /etc/nginx/snippets/security-headers.conf;` again so these
#   are not dropped. HTML-serving locations inherit these fine.
# ==========================================================================

# Clickjacking protection (legacy header + modern CSP frame-ancestors below).
add_header X-Frame-Options "SAMEORIGIN" always;

# Legacy XSS filter toggle (kept per requirement; superseded by CSP).
add_header X-XSS-Protection "1; mode=block" always;

# Stop MIME-type sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Referrer hygiene — send origin only on cross-origin requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Lock down powerful browser features we do not use.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Content-Security-Policy (split into parts — avoids wrap/typo bugs in long lines).
# frame-src hosts (each on its own line for safe editing):
#   'self'
#   https://www.googletagmanager.com
#   https://tagmanager.google.com      (GTM Preview / Tag Assistant)
#   https://tagassistant.google.com    (Tag Assistant debugger iframe)
#   https://nshn.ir
#   https://neshan.org
#   https://*.neshan.org
#   https://maps.neshan.org
#   https://balad.ir
#   https://map.ir
set $csp_default "default-src 'self'";
set $csp_script "script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://tagmanager.google.com https://tagassistant.google.com";
set $csp_style "style-src 'self' 'unsafe-inline'";
set $csp_img "img-src 'self' data: https:";
set $csp_font "font-src 'self' data:";
set $csp_connect "connect-src 'self' https: wss: ws: https://tagassistant.google.com wss://tagassistant.google.com";
set $csp_frame "frame-src 'self' https://www.googletagmanager.com https://tagmanager.google.com https://tagassistant.google.com https://nshn.ir https://neshan.org https://*.neshan.org https://maps.neshan.org https://balad.ir https://map.ir";
set $csp_misc "frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
set $csp_policy "$csp_default; $csp_script; $csp_style; $csp_img; $csp_font; $csp_connect; $csp_frame; $csp_misc";
add_header Content-Security-Policy $csp_policy always;
