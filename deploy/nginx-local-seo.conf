# Nginx — dynamic Local SEO routes /{city}/{specialty}
#
# Strategy: proxy city/specialty paths to Python sidecar (fast cache) OR Node backend.
# Include inside salam-doctor.com HTTPS server block (after site-locations.conf):
#   include /etc/nginx/conf.d/nginx-local-seo.conf;
#
# docker-compose (optional sidecar):
#   local-seo:
#     build: ./python
#     command: python -m local_seo.app
#     expose: ["8020"]
#     environment:
#       SITE_BASE: https://salam-doctor.com
#     networks: [salam-doctor-net]

upstream local_seo_app {
    server local-seo:8020;
    keepalive 16;
}

# ── Multi-city local hubs: /tehran/hair-transplant, /isfahan/botox, … ───────
# Only NEW multi-city hubs — /shiraz/* stays on Node (seoRouter.js)
location ~ ^/(tehran|isfahan|mashhad|tabriz|ahvaz|kerman)/([a-z0-9]+(?:-[a-z0-9]+)*)/?$ {
    proxy_pass         http://local_seo_app;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # Hub HTML is cacheable — matches Python/Node Cache-Control: max-age=300
    proxy_cache_valid 200 5m;
    add_header X-Local-Seo-Route "$1/$2" always;
    add_header X-Cache-Status $upstream_cache_status;
}

# ── Legacy Shiraz namespace (existing Node seoRouter) — keep on backend ─────
# Already in nginx-site-locations.conf:
#   location /shiraz/ { proxy_pass http://backend_app; ... }
#
# Optional 301 canonical migration to new pattern:
# location ~ ^/shiraz/([a-z0-9-]+)/?$ {
#     return 301 https://salam-doctor.com/shiraz/$1;
# }
# (shiraz/shiraz/slug is wrong — legacy stays /shiraz/:slug OR map to /shiraz/:slug)

# ── Local SEO sitemap supplement ───────────────────────────────────────────
location = /sitemap-local.xml {
    proxy_pass         http://local_seo_app/sitemap-local.xml;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    expires 6h;
    add_header Cache-Control "public, max-age=21600";
}

