# ==========================================================================
# docker-compose.shirazbeauty.yml — isolated shirazbeauty.ir stack
# --------------------------------------------------------------------------
# Runs alongside the primary salam-doctor stack without sharing networks,
# volumes, or environment files. Host port 8080 → shirazbeauty-web.
#
# Prepare once:
#   cp .env.shirazbeauty.example .env.shirazbeauty
#   # edit .env.shirazbeauty — set POSTGRES_PASSWORD and matching DATABASE_URL
#   mkdir -p shirazbeauty/data/uploads && touch shirazbeauty/data/leads.db
#
# Start (background):
#   docker compose -f docker-compose.shirazbeauty.yml -p shirazbeauty up -d --build
#
# Stop without touching the primary stack:
#   docker compose -f docker-compose.shirazbeauty.yml -p shirazbeauty down
# ==========================================================================

name: shirazbeauty

services:
  shirazbeauty-db:
    image: postgres:14-alpine
    container_name: shirazbeauty-db
    restart: unless-stopped
    env_file:
      - .env.shirazbeauty
    volumes:
      - shirazbeauty_pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - shirazbeauty-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shirazbeauty -d shirazbeauty"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  shirazbeauty-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shirazbeauty-backend
    restart: unless-stopped
    depends_on:
      shirazbeauty-db:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: production
    env_file:
      - .env.shirazbeauty
    volumes:
      - ./shirazbeauty/data/leads.db:/app/leads.db
      - ./shirazbeauty/data/uploads:/app/uploads
      - ./server.js:/app/server.js:ro
      - ./categoryMonetize.js:/app/categoryMonetize.js:ro
      - ./serviceLanding.js:/app/serviceLanding.js:ro
      - ./siteSettings.js:/app/siteSettings.js:ro
      - ./seoInfra.js:/app/seoInfra.js:ro
      - ./seoRouter.js:/app/seoRouter.js:ro
      - ./searchRouter.js:/app/searchRouter.js:ro
      - ./search-index.js:/app/search-index.js:ro
      - ./DirectoryRepository.js:/app/DirectoryRepository.js:ro
      - ./articleTemplate.js:/app/articleTemplate.js:ro
      - ./blogArticles.js:/app/blogArticles.js:ro
      - ./uploadApp.js:/app/uploadApp.js:ro
      - ./seo-config.js:/app/seo-config.js:ro
      - ./views:/app/views:ro
      - ./data.min.js:/app/data.min.js:ro
      - ./profile.html:/app/profile.html:ro
    expose:
      - "3000"
    networks:
      - shirazbeauty-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  shirazbeauty-web:
    image: nginx:alpine
    container_name: shirazbeauty-web
    restart: unless-stopped
    depends_on:
      shirazbeauty-backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./shirazbeauty:/usr/share/nginx/html:ro
      - ./deploy/shirazbeauty-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shirazbeauty-net
      - salam-doctor-net

networks:
  shirazbeauty-net:
    name: shirazbeauty-net
    driver: bridge
  salam-doctor-net:
    external: true
    name: salam-doctor_salam-doctor-net

volumes:
  shirazbeauty_pg_data:
    name: shirazbeauty_pg_data
