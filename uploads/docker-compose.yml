services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salam-doctor-backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      NODE_ENV: production
      SITE_BASE: "https://salam-doctor.ir"
    env_file:
      - .env
    volumes:
      - ./leads.db:/app/leads.db
      - ./uploads:/app/uploads
      - ./clinic-intros:/app/clinic-intros
      - ./server.js:/app/server.js:ro
      - ./serviceLanding.js:/app/serviceLanding.js:ro
      - ./siteSettings.js:/app/siteSettings.js:ro
      - ./seoInfra.js:/app/seoInfra.js:ro
      - ./seoRouter.js:/app/seoRouter.js:ro
      - ./DirectoryRepository.js:/app/DirectoryRepository.js:ro
      - ./articleTemplate.js:/app/articleTemplate.js:ro
      - ./seo-config.js:/app/seo-config.js:ro
      - ./views:/app/views:ro
      - ./data.min.js:/app/data.min.js:ro
      - ./profile.html:/app/profile.html:ro
    expose:
      - "3000"
    networks:
      - salam-doctor-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: nginx:alpine
    container_name: salam-doctor-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-site-locations.conf:/etc/nginx/conf.d/site-locations.conf:ro
      # Shared snippets + generated per-clinic dedicated-site server blocks.
      - ./deploy/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./deploy/clinic-proxy.conf:/etc/nginx/snippets/clinic-proxy.conf:ro
      - ./deploy/clinic-sites.d:/etc/nginx/clinic-sites.d:ro
      - /etc/nginx/certs/.htpasswd:/etc/nginx/certs/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - salam-doctor-net
    # Reload every 6h so renewed Let's Encrypt certs are picked up without a
    # restart, while nginx stays in the foreground as PID 1.
    command: >-
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'"

  # Automated Let's Encrypt renewal loop (shares the ACME webroot with web).
  # Initial issuance for new clinic domains: scripts/add-clinic-domain.sh.
  certbot:
    image: certbot/certbot:latest
    container_name: salam-doctor-certbot
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

networks:
  salam-doctor-net:
    driver: bridge
