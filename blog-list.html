  <style>
    .blog-page{background:#fff;min-height:60vh}
    .blog-wrap{padding:22px 0 54px}
    .blog-intro{margin-top:14px;max-width:860px}
    .blog-intro h1{font-size:clamp(1.75rem,3.2vw,2.45rem);line-height:1.5;font-weight:800}
    .blog-intro p{margin-top:10px;color:var(--muted)}
    .blog-grid{
      margin-top:28px;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:18px;
    }
    .blog-card{
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
      background:#fff;
      display:flex;
      flex-direction:column;
    }
    .blog-card-media{display:block;line-height:0;background:#e8f0f6}
    .blog-card-media img,
    .blog-card-placeholder{
      width:100%;
      height:180px;
      object-fit:cover;
      display:block;
    }
    .blog-card-placeholder{background:linear-gradient(135deg,#e8f4fd,#f1f5f9)}
    .blog-card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
    .blog-card-author{font-size:.78rem;color:var(--blue);font-weight:700}
    .blog-card-body h2{font-size:1.05rem;line-height:1.7;font-weight:800}
    .blog-card-body h2 a{color:var(--text);text-decoration:none}
    .blog-card-body h2 a:hover{color:var(--blue)}
    .blog-card-body p{color:var(--muted);font-size:.9rem;line-height:1.8;flex:1}
    .blog-card-body .btn{margin-top:6px;align-self:flex-start}
    .blog-empty{text-align:center;color:var(--muted);padding:40px 0}
    @media (max-width:900px){
      .blog-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width:600px){
      .blog-grid{grid-template-columns:1fr}
    }
  </style>
