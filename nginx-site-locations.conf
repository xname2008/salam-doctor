    return 301 $1;
}

# Category landing pages — Node injects dynamic title/description/BreadcrumbList.
# Fall back to the static file in the nginx web root if the backend 404s
# (e.g. HTML missing from the image before a rebuild).
# Note: service .html hubs (incl. pharmacy) 301 to /shiraz/* above.
location ~ ^/(products|eye)\.html$ {
    proxy_pass             http://backend_app;
    proxy_http_version     1.1;
    proxy_set_header       Host              $host;
    proxy_set_header       X-Real-IP         $remote_addr;
    proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto $scheme;
    proxy_set_header       Connection        "";
    proxy_intercept_errors on;
    error_page 404 = @category_html_static;
}

location @category_html_static {
    root /usr/share/nginx/html;
    try_files $uri =404;
}

location ~* ^/(images|assets|fonts|clinics)/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}

location /uploads/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}

location ^~ /backups/ {
    deny all;
    return 404;
}

location ~* ^/(leads\.db|leads\.db-wal|leads\.db-shm|leads-snapshot\.db|leads\.json|server\.js|docker-compose\.yml|Dockerfile|nginx\.conf|package\.json|package-lock\.json)$ {
    deny all;
    return 404;
}
location = /admin {
    auth_basic           "Restricted Access";
    auth_basic_user_file /etc/nginx/certs/.htpasswd;
    try_files            /admin.html =404;
}
location = /admin.html {
    auth_basic           "Restricted Access";
    auth_basic_user_file /etc/nginx/certs/.htpasswd;
    try_files            /admin.html =404;
}
