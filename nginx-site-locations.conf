# /profile.html, /doctor/, /services/ — defined once in
# deploy/nginx-seo-performance.conf (duplicate locations break nginx -t / reload).

# Canonical home is /. Only explicit /index.html requests get 301 (not internal index).
location = /index.html {
    return 301 /;
}

location = /category.html {
    proxy_pass             http://backend_app;
    proxy_http_version     1.1;
    proxy_set_header       Host              $host;
    proxy_set_header       X-Real-IP         $remote_addr;
    proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto $scheme;
    proxy_set_header       Connection        "";
    proxy_intercept_errors on;
    error_page 404 = @category_html_static;
}

