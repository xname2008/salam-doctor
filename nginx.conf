user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Larger hash bucket so long/unicode server_name + map keys don't overflow.
    server_names_hash_bucket_size 128;

    # WebSocket upgrade plumbing (socket.io chat).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ArvanCloud / Cloudflare terminate TLS at the edge and send HTTP to origin
    # with X-Forwarded-Proto: https. Normalise the effective scheme so the app
    # and redirects behave correctly whether traffic is edge-proxied or direct.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Redirect to HTTPS ONLY for genuine plain-HTTP visitors (never when the
    # edge already served HTTPS — that would cause a redirect loop).
    map $http_x_forwarded_proto $redirect_to_https {
        default 1;
        https   0;
    }

    # ----------------------------------------------------------------------
    # Requirement #4 — mandatory platform backlink (per clinic domain).
    # The value is injected into every clinic HTML response by sub_filter
    # (see snippets/clinic-proxy.conf). Add a line per clinic to point the
    # anchor at the most relevant hub; unknown domains fall back to /beauty.
    # ----------------------------------------------------------------------
    map $host $clinic_backlink_html {
        default      '<a href="https://salam-doctor.com/shiraz/beauty" rel="dofollow" title="بهترین کلینیک زیبایی شیراز">بهترین کلینیک زیبایی شیراز</a>';
        dr-nahal.ir  '<a href="https://salam-doctor.com/shiraz/hair-transplant" rel="dofollow" title="بهترین کلینیک کاشت مو شیراز">بهترین کلینیک کاشت مو شیراز</a>';
    }

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/css
        application/javascript
        application/json
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # Shared upstream — the single Node/Express platform backend.
    upstream backend_app {
        server backend:3000;
        keepalive 32;
    }

    # ======================================================================
    # 1) PRIMARY DOMAIN  —  salam-doctor.com (international / Google Ads)
    # ======================================================================
    # Prerequisite (run once before first deploy):
    #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
    #     -d salam-doctor.com -d www.salam-doctor.com
    # ======================================================================

    # --- HTTP: ACME + 301 apex/www → HTTPS canonical ---
    server {
        listen       80;
        server_name  salam-doctor.com www.salam-doctor.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://salam-doctor.com$request_uri;
        }
    }

    # --- HTTPS: www → non-www canonical redirect ---
    server {
        listen       443 ssl;
        http2        on;
        server_name  www.salam-doctor.com;
        ssl_certificate     /etc/letsencrypt/live/salam-doctor.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/salam-doctor.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        return 301 https://salam-doctor.com$request_uri;
    }

    # --- HTTPS: primary platform (non-www) → backend:3000 ---
    server {
        listen       443 ssl;
        http2        on;
        server_name  salam-doctor.com;
        root         /usr/share/nginx/html;
        index        index.html;

        ssl_certificate     /etc/letsencrypt/live/salam-doctor.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/salam-doctor.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/conf.d/site-locations.conf;
        include /etc/nginx/conf.d/nginx-seo-performance.conf;

        # Serve homepage without internal /index.html redirect (avoids proxy loop).
        location = / {
            try_files /index.html =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # ======================================================================
    # 1b) LEGACY DOMAIN  —  salam-doctor.ir / www.salam-doctor.ir
    # ----------------------------------------------------------------------
    # Permanent (301) SEO-safe redirect to the new primary domain so link
    # equity / rankings accrued on the old local domain transfer over.
    # The salam-doctor.ir certificate is kept renewing (certbot service)
    # purely so the HTTPS redirect below can complete the TLS handshake —
    # do NOT remove it while any traffic/backlinks still hit the old host.
    # ======================================================================

    # --- HTTP: legacy .ir domain → canonical .com ---
    server {
        listen       80;
        server_name  salam-doctor.ir www.salam-doctor.ir;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://salam-doctor.com$request_uri;
        }
    }

    # --- HTTPS: old domain (both host variants) — hard 301 to apex .com ---
    # TEMP (SSL bootstrap): commented out — no Let's Encrypt certs on this host
    # yet, so nginx cannot bind :443. Re-enable after `certbot certonly` succeeds.
    # server {
    #     listen       443 ssl;
    #     http2        on;
    #     server_name  salam-doctor.ir www.salam-doctor.ir;
    #
    #     ssl_certificate     /etc/letsencrypt/live/salam-doctor.ir/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/salam-doctor.ir/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     return 301 https://salam-doctor.com$request_uri;
    # }

    # ======================================================================
    # 2) MULTI-TENANCY  —  dedicated clinic domains (e.g. dr-nahal.ir)
    # ----------------------------------------------------------------------
    # Two ways in, both handled here:
    #   (a) Edge-TLS via ArvanCloud/Cloudflare: clinic TLS terminates at the
    #       CDN, origin receives HTTP + X-Forwarded-Proto https on :80. This
    #       catch-all default_server serves them (host-based multi-tenancy).
    #   (b) Direct-to-origin with its own Let's Encrypt cert: use
    #       scripts/add-clinic-domain.sh to generate a dedicated :443 server
    #       block under clinic-sites.d/ (loaded by the include below). Those
    #       specific server_names win over this catch-all via SNI/Host match.
    # ======================================================================

    # HTTP catch-all for ANY clinic domain (ACME + edge-TLS proxy).
    server {
        listen       80 default_server;
        server_name  _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/clinic-proxy.conf;   # location / -> backend + backlink
    }

    # HTTPS default_server: safely reject unknown SNI instead of leaking the
    # platform certificate to unregistered clinic domains. Registered clinics
    # get their own matching :443 block (see clinic-sites.d include below).
    # TEMP (SSL bootstrap): commented out — no Let's Encrypt certs on this host
    # yet, so nginx cannot bind :443. Re-enable after `certbot certonly` succeeds.
    # server {
    #     listen               443 ssl default_server;
    #     http2                on;
    #     server_name          _;
    #     ssl_reject_handshake on;
    # }

    # Generated per-clinic dedicated-site server blocks (Let's Encrypt).
    # Wildcard include is safe when the directory is empty.
    include /etc/nginx/clinic-sites.d/*.conf;
}
